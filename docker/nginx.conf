# nginx 配置：nginx 是"反向代理"，站在应用前面，所有外部请求先到它，再由它转发给应用。
# 为什么不让用户直接访问应用（uvicorn）：
#   1. nginx 处理大量连接、慢速客户端更稳，uvicorn 只专心跑业务代码
#   2. 在入口处就拦截超大的上传，不让它们占用应用的带宽和磁盘
#   3. 以后配 HTTPS 证书、加限流、托管静态文件，都在这里配，不用改应用代码

server {
    # 监听 80 端口（HTTP 默认端口）。用户访问 http://服务器IP 就到这里
    listen 80;
    # 匹配所有域名和 IP（还没有域名，先用 IP 访问）
    server_name _;

    # 请求体最大 11MB。应用限制文件 10MB，这里稍微放宽一点，给表单的其他部分留余量。
    # 超过的请求 nginx 直接返回 413，根本不会转发给应用
    client_max_body_size 11m;

    # 用 Docker 内置的 DNS 服务器（固定地址 127.0.0.11）把服务名 app 解析成 IP，结果只缓存 10 秒。
    # 为什么需要：nginx 默认只在启动时解析一次 proxy_pass 里的域名，之后一直用那个 IP。
    # 而每次重新构建、重建应用容器，Docker 都可能给它分配一个新 IP，nginx 还往旧 IP 发请求，用户就看到 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 所有路径都转发给应用
    location / {
        # app 是 docker-compose.yml 里的服务名，8000 是应用在容器里监听的端口。
        # 先放进变量再用：proxy_pass 里写变量时，nginx 才会在每次请求时通过上面的 resolver 重新解析
        set $app_upstream http://app:8000;
        proxy_pass $app_upstream;
        # 把原始请求的信息传给应用。经过代理后，应用看到的"客户端"是 nginx，
        # 这几个请求头让应用能知道用户真正访问的地址和用户的真实 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 等应用返回的最长时间。默认 60 秒；提问时 LLM 每次最多 30 秒、失败还会重试，
        # 放宽到 120 秒，避免应用还在等 LLM，nginx 先断开返回 504
        proxy_read_timeout 120s;
    }
}
